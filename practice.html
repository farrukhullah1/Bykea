<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bykea Tabs</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 80px;
}

.content {
    max-width: 500px;
}

.tabs {
    margin-bottom: 30px;
}

.tab {
    background: none;
    border: none;
    font-size: 16px;
    margin-right: 20px;
    cursor: pointer;
    padding-bottom: 5px;
}

.tab.active {
    color: #00a651;
    border-bottom: 2px solid #00a651;
    font-weight: bold;
}

h1 {
    color: #00a651;
    font-size: 48px;
    margin-bottom: 20px;
}

p {
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 20px;
}

.read-more {
    color: #00a651;
    text-decoration: none;
    font-weight: bold;
}

.image {
    width: 450px;
    height: 350px;   /* FIXED HEIGHT */
    display: flex;
    align-items: center;
    justify-content: center;
}

.image img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}


@media (max-width: 1024px) {
    .hero {
        padding: 50px;
        gap: 40px;
    }

    h1 {
        font-size: 40px;
    }

    .image {
        width: 380px;
        height: 300px;
    }
}
@media (max-width: 768px) {
    .hero {
        flex-direction: column;
        padding: 40px 20px;
        text-align: center;
    }

    .content {
        max-width: 100%;
    }

    .tabs {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    }

    .tab {
        margin-right: 15px;
        font-size: 14px;
    }

    h1 {
        font-size: 34px;
    }

    p {
        font-size: 15px;
    }

    .image {
        width: 100%;
        height: 260px;
        margin-top: 30px;
    }
}
@media (max-width: 480px) {
    h1 {
        font-size: 28px;
    }

    .tab {
        font-size: 13px;
        margin-right: 10px;
    }

    .image {
        height: 220px;
    }
}


</style>
</head>
<body>

<section class="hero">
    <div class="content">

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-type="ride">Ride</button>
            <button class="tab" data-type="delivery">Delivery</button>
            <button class="tab" data-type="shops">Shops</button>
        </div>

        <!-- Text Content -->
        <h1 id="title">Ride</h1>
        <p id="description">
            Bykea offers rides on motorbikes, rickshaws, and cars at the lowest fares in Karachi, Lahore and Islamabad.
        </p>
        <a href="#" class="read-more">Read More →</a>
    </div>

    <!-- Image -->
    <div class="image">
        <img id="heroImage" src="./assets/03-Bykea-Lower-Banner-SJ-Ride-e15839371395834.png" alt="Ride">
    </div>
</section>

<script>
const data = {
    ride: {
        title: "Ride",
        description: "Bykea offers rides on motorbikes, rickshaws, and cars at the lowest fares in Karachi, Lahore and Islamabad.",
        image: "./assets/03-Bykea-Lower-Banner-SJ-Ride-e15839371395834.png"
    },
    delivery: {
        title: "Delivery",
        description: "Send parcels, documents, and food instantly with Bykea Delivery. Fast, safe and affordable.",
        image: "./assets/index-delivery-img.png"
    },
    shops: {
        title: "Shops",
        description: "Order groceries, medicines, and daily essentials from nearby shops using Bykea.",
        image: "./assets/index-shop-img.png"
    }
};

const tabs = document.querySelectorAll(".tab");
const title = document.getElementById("title");
const description = document.getElementById("description");
const heroImage = document.getElementById("heroImage");

tabs.forEach(tab => {
    tab.addEventListener("click", () => {
        // Remove active class
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const type = tab.dataset.type;
        title.textContent = data[type].title;
        description.textContent = data[type].description;
        heroImage.src = data[type].image;
        heroImage.alt = data[type].title;
    });
});

</script>
</body>
</html>
